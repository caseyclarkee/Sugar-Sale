<!DOCTYPE html>
<html lang="en">
<head>
  <!-- AGE GATE: pre-hydration lock -->
  <script>
    (function(){ try { document.documentElement.classList.add('agegate-active'); } catch(e){} })();
  </script>
  <style>
    .agegate-active body > :not(#age-gate-overlay) { display: none !important; }
    .agegate-active body { overflow: hidden !important; }

    /* Age gate (brand look + colours) */
    #age-gate-overlay {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #fff;
    }
    #age-gate-overlay .card {
      width: min(92vw, 560px);
      background: #fff; color: #333333;
      border: 3px solid #333333; border-radius: 12px;
      box-shadow: 6px 6px 0 #333333; padding: 28px;
      font-family: "futura-pt","Futura",sans-serif;
    }
    #age-gate-overlay .brand { display:flex; align-items:center; gap:12px; margin:0 0 10px; }
    #age-gate-overlay .brand img { height: 56px; display:block; }
    #age-gate-overlay h1 { margin: 4px 0 6px; font-size: 28px; line-height: 1.2; font-weight: 900; text-transform: uppercase; }
    #age-gate-overlay .row { display:flex; gap:12px; margin-bottom: 12px; }
    #age-gate-overlay input {
      flex:1; min-width: 84px; padding: 12px 10px; text-align:center;
      border-radius: 10px; border: 3px solid #333333; background: #fff; color:#333333; font-weight: 800;
    }
    #age-gate-overlay .cta {
      width: 100%; margin-top: 10px;
      border: 3px solid #333333; background: #FFDD00; color: #333333;
      font-weight: 900; text-transform: uppercase; border-radius: 10px; box-shadow: 5px 5px 0 #333333;
    }
    #age-gate-overlay .error { color:#b91c1c; font-weight: 700; min-height: 18px; margin-top: 8px; }
    #age-gate-overlay .fineprint { margin: 14px 0 0; font-size: 12px; color:#444; }
  </style>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sugar Liquidation Sale — Coming Soon</title>

  <!-- Adobe Fonts (Futura PT) -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/sdg5fiu.css">

  <!-- Site styles -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body style="font-family:'futura-pt','Futura',sans-serif;">

  <!-- AGE GATE OVERLAY -->
  <div id="age-gate-overlay" aria-modal="true" role="dialog">
    <div class="card">
      <div class="brand">
        <img src="/images/sugar-lockup.png" alt="Sugar Liquidation Sale" onerror="this.style.display='none'">
      </div>
      <h1>Are you 18 or older?</h1>
      <p class="helper">Enter your date of birth to continue.</p>
      <form id="age-gate-form" novalidate>
        <div class="row">
          <input id="dob-day" type="text" inputmode="numeric" placeholder="DD" maxlength="2">
          <input id="dob-month" type="text" inputmode="numeric" placeholder="MM" maxlength="2">
          <input id="dob-year" type="text" inputmode="numeric" placeholder="YYYY" maxlength="4">
        </div>
        <button type="submit" class="cta">Enter</button>
        <p id="age-gate-error" class="error"></p>
        <p class="fineprint">If you are under 18, please leave this site.</p>
      </form>
    </div>
  </div>

  <!-- React mount -->
  <div id="root"></div>

  <!-- Modal: Register Interest -->
  <div id="modal-overlay" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" style="display:none;">
    <div class="modal-card" role="document">
      <button class="close" id="modal-close" aria-label="Close">×</button>
      <h2 class="modal-title">Register your interest</h2>
      <form name="interest" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="interest" />
        <input type="hidden" name="bot-field" />
        <div class="form-grid">
          <input class="input" type="text" name="name" placeholder="Name" required />
          <input class="input" type="email" name="email" placeholder="Email" required />
          <button type="submit" class="cta">Notify Me</button>
        </div>
      </form>
      <p class="success" id="modal-success" style="display:none;">Thanks! You’re on the list.</p>
      <small class="muted">We’ll only email you about launch details.</small>
    </div>
  </div>


  <!-- Modal for Register Interest -->
  <div id="interestModal" class="modal">
    <div class="modal-card">
      <span id="closeModal" class="close" aria-label="Close">&times;</span>
      <h2>Register your interest</h2>
      <!-- Netlify form lives here (only one form named "interest") -->
      <form name="interest" data-netlify="true" netlify-honeypot="bot-field">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <button type="submit" class="cta">Submit</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer style="text-align: center; margin-top: 20px;">
    <div style="display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
      <a href="https://www.asahibeverages.com/website-terms-of-use-new-zealand"
         target="_blank" rel="noopener noreferrer"
         style="text-decoration: none; border: 3px solid #333333; background: white; color: #333333; padding: 10px 16px; border-radius: 8px; box-shadow: 4px 4px 0 #333333; font-weight: 700;"
         onmouseover="this.style.background='#FFDD00'; this.style.boxShadow='2px 2px 0 #333333'"
         onmouseout="this.style.background='white'; this.style.boxShadow='4px 4px 0 #333333'">
        Terms of Use
      </a>
      <a href="https://www.asahibeverages.com/privacy-collection-notice"
         target="_blank" rel="noopener noreferrer"
         style="text-decoration: none; border: 3px solid #333333; background: white; color: #333333; padding: 10px 16px; border-radius: 8px; box-shadow: 4px 4px 0 #333333; font-weight: 700;"
         onmouseover="this.style.background='#FFDD00'; this.style.boxShadow='2px 2px 0 #333333'"
         onmouseout="this.style.background='white'; this.style.boxShadow='4px 4px 0 #333333'">
        Privacy Collection Notice
      </a>
      <a href="https://www.asahibeverages.com/privacy-policy"
         target="_blank" rel="noopener noreferrer"
         style="text-decoration: none; border: 3px solid #333333; background: white; color: #333333; padding: 10px 16px; border-radius: 8px; box-shadow: 4px 4px 0 #333333; font-weight: 700;"
         onmouseover="this.style.background='#FFDD00'; this.style.boxShadow='2px 2px 0 #333333'"
         onmouseout="this.style.background='white'; this.style.boxShadow='4px 4px 0 #333333'">
        Privacy Policy
      </a>
    </div>
  </footer>

  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- App (cache-busted so the new app.js loads) -->
  <script src="./app.js?v=2"></script>

  <!-- Modal Logic (delegated; works even if React renders button later) -->
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const modal = document.getElementById("interestModal");
    const closeBtn = document.getElementById("closeModal");

    document.addEventListener("click", function(e) {
      if (e.target && e.target.id === "openFormBtn") {
        modal.style.display = "flex";
      }
    });
    if (closeBtn) closeBtn.addEventListener("click", () => modal.style.display = "none");
    if (modal) modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
  });
  </script>

  <!-- Age Gate Logic -->
  <script>
  (function () {
    const KEY = 'age_verified_until';
    const ONE_HOUR_MS = 60 * 60 * 1000;
    function now(){ return Date.now(); }
    function hasPass(){ try { const v = localStorage.getItem(KEY); return v && parseInt(v,10) > now(); } catch(_) { return false; } }
    function givePass(){ try { localStorage.setItem(KEY, String(now() + ONE_HOUR_MS)); } catch(_){} }
    function validDate(y,m,d){ y=+y; m=+m; d=+d; if(!y||!m||!d||y<1900||m<1||m>12) return false; return d>=1 && d<=new Date(y,m,0).getDate(); }
    function is18(y,m,d){ const t=new Date(), cutoff=new Date(t.getFullYear()-18, t.getMonth(), t.getDate()); return new Date(+y,+m-1,+d) <= cutoff; }
    function unlock(){ const o=document.getElementById('age-gate-overlay'); if(o&&o.parentNode) o.parentNode.removeChild(o); document.documentElement.classList.remove('agegate-active'); }
    function init(){
      if (hasPass()) return unlock();
      const f=document.getElementById('age-gate-form'); const e=document.getElementById('age-gate-error'); if(!f) return;
      f.addEventListener('submit', ev=>{
        ev.preventDefault(); e.textContent='';
        const dd=document.getElementById('dob-day').value, mm=document.getElementById('dob-month').value, yy=document.getElementById('dob-year').value;
        if(!validDate(yy,mm,dd)) return e.textContent='Please enter a valid date (DD / MM / YYYY).';
        if(!is18(yy,mm,dd)) return e.textContent='Sorry, you must be 18 or older to enter.';
        givePass(); unlock();
      });
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
  })();
  </script>

  <script>
  
  
  (function(){
    if (window.__modalInit) return; 
    window.__modalInit = true;

    function qs(sel){ return document.querySelector(sel); }
    function qa(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }

    // Remove duplicate overlays if any slipped in
    qa('#modal-overlay').forEach(function(node, idx){
      if (idx > 0) node.parentNode && node.parentNode.removeChild(node);
    });

    function openModal(){
      const ov = qs('#modal-overlay'); if(!ov) return;
      ov.style.display='flex'; ov.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
      const first = ov.querySelector('input[name="name"]'); if(first) first.focus();
      const form = ov.querySelector('form[name="interest"]');
      const ok   = qs('#modal-success');
      if(form){ form.style.display='block'; }
      if(ok){ ok.style.display='none'; }
    }
    function closeModal(){
      const ov = qs('#modal-overlay'); if(!ov) return;
      ov.style.display='none'; ov.setAttribute('aria-hidden','true');
      document.body.style.overflow='';
    }
    function handleSubmit(ev){
      const form = ev.target;
      if(!(form && form.getAttribute('name')==='interest')) return;
      ev.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn ? submitBtn.textContent : '';
      if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Sending…'; }
      const data = new FormData(form);
      fetch('/', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
        body: new URLSearchParams(data).toString()
      }).then(()=>{
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = originalText; }
        form.reset();
        const ok = document.getElementById('modal-success');
        if(ok){ ok.style.display='block'; }
        form.style.display='none';
        const done = document.getElementById('modal-done');
        if(done){ done.addEventListener('click', closeModal, { once:true }); }
      }).catch(()=>{
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = originalText; }
        form.submit();
      });
    }
    function init(){
      // Attach to all possible triggers (in case multiple exist)
      qa('#openFormBtn, .openFormBtn').forEach(function(btn){
        btn.addEventListener('click', openModal);
      });
      const close = qs('#modal-close');
      const overlay = qs('#modal-overlay');
      if(close) close.addEventListener('click', closeModal);
      if(overlay) overlay.addEventListener('click', function(ev){ if(ev.target===overlay) closeModal(); });
      document.addEventListener('keydown', function(ev){ if(ev.key==='Escape') closeModal(); });
      document.addEventListener('submit', handleSubmit, true);
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
  })();
  </script>

</body>
</html>
