<!DOCTYPE html>
<html lang="en">
<head>
  <!-- AGE GATE: pre-hydration lock -->
<script>
  // Hide the entire app immediately so nothing shows behind the gate
  (function(){ try { document.documentElement.classList.add('agegate-active'); } catch(e){} })();
</script>
<style>
  /* Hide everything except our gate; also stop scroll */
  .agegate-active body > :not(#age-gate-overlay) { display: none !important; }
  .agegate-active body { overflow: hidden !important; }
</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sugar Liquidation Sale — Coming Soon</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* Make sure the React app doesn’t hide the footer */
    html, body { margin: 0; }
    #root { min-height: calc(100vh - 120px); /* leave room for footer */ }
    footer { padding: 24px 16px 40px; }
  </style>
</head>
<body>
  <!-- AGE GATE OVERLAY -->
<div id="age-gate-overlay" aria-modal="true" role="dialog"
     style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b0b0e;">
  <div style="width:min(92vw,540px);background:#111827;color:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.6);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;">
    <h1 style="margin:0 0 8px;font-size:24px;line-height:1.2;">Are you 18 or older?</h1>
    <p style="margin:0 0 18px;color:#d1d5db;font-size:14px;line-height:1.4;">Enter your date of birth to continue.</p>
    <form id="age-gate-form" novalidate>
      <div style="display:flex;gap:10px;margin-bottom:12px;">
        <input id="dob-day" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="DD" aria-label="Day" maxlength="2"
               style="flex:1;min-width:64px;padding:12px 10px;border-radius:10px;border:1px solid #374151;background:#0f172a;color:#e5e7eb;outline:none;">
        <input id="dob-month" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="MM" aria-label="Month" maxlength="2"
               style="flex:1;min-width:64px;padding:12px 10px;border-radius:10px;border:1px solid #374151;background:#0f172a;color:#e5e7eb;outline:none;">
        <input id="dob-year" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="YYYY" aria-label="Year" maxlength="4"
               style="flex:2;min-width:92px;padding:12px 10px;border-radius:10px;border:1px solid #374151;background:#0f172a;color:#e5e7eb;outline:none;">
      </div>
      <button type="submit" style="appearance:none;border:0;background:#facc15;color:#111827;border-radius:10px;padding:12px 14px;font-weight:700;width:100%;cursor:pointer;">Enter</button>
      <p id="age-gate-error" style="margin:10px 0 0;color:#fca5a5;font-size:13px;min-height:17px;"></p>
      <p style="margin:16px 0 0;font-size:12px;color:#9ca3af;">If you are under 18, please leave this site.</p>
    </form>
  </div>
</div>
  <!-- Hidden form MUST be inside <body> so Netlify can see it -->
  <form name="interest" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
  </form>

  <!-- Your React mount point -->
  <div id="root"></div>

  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- App -->
  <script src="./app.js"></script>

  <!-- Footer Links -->
  <footer style="text-align: center; margin-top: 60px;">
    <div style="display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; font-family: 'Arial Black', sans-serif;">
      <a
        href="https://www.asahibeverages.com/website-terms-of-use-new-zealand"
        target="_blank" rel="noopener noreferrer"
        style="text-decoration: none; border: 3px solid black; background: white; color: black; padding: 10px 16px; border-radius: 8px; box-shadow: 4px 4px 0 black; font-weight: 700;"
        onmouseover="this.style.background='yellow'; this.style.boxShadow='2px 2px 0 black'"
        onmouseout="this.style.background='white'; this.style.boxShadow='4px 4px 0 black'"
      >
        Terms of Use
      </a>

      <a
        href="https://www.asahibeverages.com/privacy-collection-notice"
        target="_blank" rel="noopener noreferrer"
        style="text-decoration: none; border: 3px solid black; background: white; color: black; padding: 10px 16px; border-radius: 8px; box-shadow: 4px 4px 0 black; font-weight: 700;"
        onmouseover="this.style.background='yellow'; this.style.boxShadow='2px 2px 0 black'"
        onmouseout="this.style.background='white'; this.style.boxShadow='4px 4px 0 black'"
      >
        Privacy Collection Notice
      </a>

      <a
        href="https://www.asahibeverages.com/privacy-policy"
        target="_blank" rel="noopener noreferrer"
        style="text-decoration: none; border: 3px solid black; background: white; color: black; padding: 10px 16px; border-radius: 8px; box-shadow: 4px 4px 0 black; font-weight: 700;"
        onmouseover="this.style.background='yellow'; this.style.boxShadow='2px 2px 0 black'"
        onmouseout="this.style.background='white'; this.style.boxShadow='4px 4px 0 black'"
      >
        Privacy Policy
      </a>
    </div>
  </footer>
</body>
</html>
