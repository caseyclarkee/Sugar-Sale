<!DOCTYPE html>
<html lang="en">
<head>
  <!-- AGE GATE: pre-hydration lock -->
  <script>(function(){try{document.documentElement.classList.add('agegate-active');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sugar Sale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/agegate.css">
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <!-- Hidden form template so Netlify detects it -->
  <form name="deal-entry" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="deal" />
  </form>

  <script type="module" src="/src/main.jsx"></script>

  <script>
  (function(){
    if (window.__ageGateInit) return; window.__ageGateInit = true;

    function unlock(){
      try{ document.documentElement.classList.remove('agegate-active'); }catch(e){}
      var ov = document.getElementById('age-gate-overlay');
      if(ov){ ov.style.display='none'; }
      document.body.style.overflow = '';
    }

    function validYear(y){
      if(!y) return false;
      var n = parseInt(y,10);
      var now = new Date();
      var currentYear = now.getFullYear();
      if(isNaN(n)) return false;
      if(n < 1900 || n > currentYear) return false;
      return true;
    }

    function is18ByYear(y){
      var now = new Date();
      var currentYear = now.getFullYear();
      return (currentYear - parseInt(y,10)) >= 18;
    }

    function getPass(){
      try{ return JSON.parse(localStorage.getItem('ageGatePass') || 'null'); }catch(e){ return null; }
    }
    function setPass(){
      try{ localStorage.setItem('ageGatePass', JSON.stringify({ ts: Date.now() })); }catch(e){}
    }
    function isPassValid(pass){
      if(!pass || !pass.ts) return false;
      var ONE_HOUR = 60 * 60 * 1000;
      return (Date.now() - pass.ts) < ONE_HOUR;
    }

    function init(){
      var pass = getPass();
      if(pass && isPassValid(pass)){ return unlock(); }

      var form = document.getElementById('age-gate-form');
      var err  = document.getElementById('age-error');
      var input = document.getElementById('birth-year');
      if(!form || !input) return;

      document.body.style.overflow = 'hidden';

      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        err.textContent = '';
        var y = (input.value || '').trim();
        if(!validYear(y)){ err.textContent = 'Please enter a valid 4-digit year.'; return; }
        if(!is18ByYear(y)){ err.textContent = 'Sorry, you must be 18 or older.'; return; }
        setPass();
        unlock();
      });

      try{ input.focus(); }catch(e){}
    }

    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
  })();
  </script>

</body>
</html>
