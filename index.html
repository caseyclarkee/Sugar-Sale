<!DOCTYPE html>

<head>
  <!-- AGE GATE: pre-hydration lock -->
  <script>
    // Hide entire app immediately so nothing shows behind the gate
    (function(){ try { document.documentElement.classList.add('agegate-active'); } catch(e){} })();
  </script>
  <style>
    /* Hide everything except our gate */
    .agegate-active body > :not(#age-gate-overlay) { display: none !important; }
    .agegate-active body { overflow: hidden !important; }

    /* Overlay + Card (brand look + colours) */
    #age-gate-overlay {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #fff;
    }
    #age-gate-overlay .card {
      width: min(92vw, 560px);
      background: #fff; color: #333333;
      border: 3px solid #333333; border-radius: 12px;
      box-shadow: 6px 6px 0 #333333; padding: 28px;
      font-family: "futura-pt", "Futura", sans-serif;
    }
    #age-gate-overlay .brand { display:flex; align-items:center; gap:12px; margin:0 0 10px; }
    #age-gate-overlay .brand img { height: 56px; display:block; }
    #age-gate-overlay h1 {
      margin: 4px 0 6px; font-size: 28px; line-height: 1.2;
      font-weight: 900; text-transform: uppercase;
    }
    #age-gate-overlay .row { display:flex; gap:12px; margin-bottom: 12px; }
    #age-gate-overlay input {
      flex:1; min-width: 84px; padding: 12px 10px; text-align:center;
      border-radius: 10px; border: 3px solid #333333;
      background: #fff; color:#333333; font-weight: 800;
    }
    #age-gate-overlay .cta {
      width: 100%; margin-top: 10px;
      border: 3px solid #333333;
      background: #FFDD00; color: #333333;
      font-weight: 900; text-transform: uppercase;
      border-radius: 10px; box-shadow: 5px 5px 0 #333333;
    }
    #age-gate-overlay .error { color:#b91c1c; font-weight: 700; min-height: 18px; margin-top: 8px; }
    #age-gate-overlay .fineprint { margin: 14px 0 0; font-size: 12px; color:#444; }
  </style>

<body style="font-family:'futura-pt','Futura',sans-serif;">

  <div id="age-gate-overlay" aria-modal="true" role="dialog">

  <!-- Footer -->

      <a href="https://www.asahibeverages.com/website-terms-of-use-new-zealand"

  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <!-- App -->
  <script src="./app.js"></script>

  <!-- Modal Logic -->
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const modal = document.getElementById("interestModal");
    const openBtn = document.getElementById("openFormBtn");
    const closeBtn = document.getElementById("closeModal");
    if (openBtn) openBtn.addEventListener("click", () => modal.style.display = "flex");
    if (closeBtn) closeBtn.addEventListener("click", () => modal.style.display = "none");
    if (modal) modal.addEventListener("click", e => { if (e.target === modal) modal.style.display = "none"; });
  });
  </script>

  <!-- Age Gate Logic -->
  <script>
  (function () {
    const KEY = 'age_verified_until';
    const ONE_HOUR_MS = 60 * 60 * 1000;
    function now(){ return Date.now(); }
    function hasPass(){
      try { const v = localStorage.getItem(KEY); return v && parseInt(v,10) > now(); }
      catch(_) { return false; }
    }
    function givePass(){ try { localStorage.setItem(KEY, String(now() + ONE_HOUR_MS)); } catch(_){} }
    function validDate(y,m,d){
      y=+y; m=+m; d=+d;
      if(!y||!m||!d||y<1900||m<1||m>12) return false;
      return d>=1 && d<=new Date(y,m,0).getDate();
    }
    function is18(y,m,d){
      const t=new Date(), cutoff=new Date(t.getFullYear()-18, t.getMonth(), t.getDate());
      return new Date(+y,+m-1,+d) <= cutoff;
    }
    function unlock(){
      const o=document.getElementById('age-gate-overlay');
      if(o&&o.parentNode) o.parentNode.removeChild(o);
      document.documentElement.classList.remove('agegate-active');
    }
    function init(){
      if (hasPass()) return unlock();
      const f=document.getElementById('age-gate-form');
      const e=document.getElementById('age-gate-error');
      if(!f) return;
      f.addEventListener('submit', ev=>{
        ev.preventDefault(); e.textContent='';
        const dd=document.getElementById('dob-day').value;
        const mm=document.getElementById('dob-month').value;
        const yy=document.getElementById('dob-year').value;
        if(!validDate(yy,mm,dd)) return e.textContent='Please enter a valid date (DD / MM / YYYY).';
        if(!is18(yy,mm,dd)) return e.textContent='Sorry, you must be 18 or older to enter.';
        givePass(); unlock();
      });
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>
</body>
</html>
