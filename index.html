<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sugar Liquidation Sale™</title>

  <!-- Tailwind CDN for continuity with teaser -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="icon" type="image/png" href="./images/favicon.png" />

  <script>(function(){try{document.documentElement.classList.add('agegate-active');}catch(e){}})();</script>
  <style>
    body {
      font-family: "futura-pt", Futura, "Avenir Next", Avenir, Montserrat, Arial, sans-serif;
      background: #fff;
      color: #111;
      margin: 0;
      padding: 0;
    }

    .agegate-active body > :not(#age-gate-overlay) {
      display: none !important;
    }

    .agegate-active body {
      overflow: hidden !important;
    }

    #age-gate-overlay.age-gate {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
    }

    .age-card {
      border: 2px solid #111;
      border-radius: 16px;
      padding: 16px;
      width: min(560px, 92vw);
      background: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .12);
    }

    #age-gate-form .row {
      display: flex;
      gap: .6rem;
      align-items: center;
    }

    #age-gate-form input[type="number"] {
      border: 2px solid #333;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      width: 100%;
    }

    #age-gate-form .cta {
      background: #6b21a8;
      color: #fff;
      border-radius: 12px;
      font-weight: 900;
      padding: .8rem 1rem;
      border: none;
      cursor: pointer;
    }

    .error {
      color: #b00020;
      font-weight: 700;
      margin: 6px 0 0;
    }
  </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen">
  <!-- Age Gate Overlay -->
  <div id="age-gate-overlay" class="age-gate" role="dialog" aria-modal="true" aria-labelledby="age-title">
    <div class="age-card">
      <h2 id="age-title" class="text-2xl font-bold mb-4">Are you 18 or older? Enter your birth year</h2>
      <form id="age-gate-form">
        <div class="row mb-2">
          <input type="number" id="birth-year" name="birth-year" placeholder="YYYY" min="1900" inputmode="numeric" required />
          <button type="submit" class="cta">Continue</button>
        </div>
        <p id="age-error" class="error" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- Main content -->
  <div class="flex flex-col items-center justify-center text-center p-10">
    <img src="./images/sugar-lockup.png" alt="Sugar Liquidation Sale" class="w-60 mb-8" />
    <h1 class="text-4xl font-black mb-4">The Sugar Liquidation Sale™</h1>
    <p class="text-lg max-w-md">
      The sweetest deals on earth. Clearing out all excess sugar before it’s gone for good.
    </p>
    <a href="#deals" class="mt-8 inline-block bg-[#6b21a8] text-white font-bold py-3 px-6 rounded-xl shadow hover:bg-[#581c87]">
      Browse Deals
    </a>
  </div>

  <script>
  (function(){
    if (window.__ageGateInit) return; window.__ageGateInit = true;
    function unlock(){
      try{ document.documentElement.classList.remove('agegate-active'); }catch(e){}
      const ov=document.getElementById('age-gate-overlay');
      if(ov){ ov.style.display='none'; }
      document.body.style.overflow='';
    }
    function validYear(y){ if(!y) return false; const n=+y, Y=(new Date).getFullYear(); return n>=1900 && n<=Y; }
    function is18ByYear(y){ return ((new Date).getFullYear() - (+y)) >= 18; }
    function getPass(){ try{ return JSON.parse(localStorage.getItem('ageGatePass')||'null'); }catch(e){ return null; } }
    function setPass(){ try{ localStorage.setItem('ageGatePass', JSON.stringify({ ts: Date.now() })); }catch(e){} }
    function isPassValid(p){ return p && p.ts && (Date.now()-p.ts) < (60*60*1000); }
    function init(){
      const pass = getPass(); if (pass && isPassValid(pass)) return unlock();
      document.body.style.overflow='hidden';
      const form = document.getElementById('age-gate-form');
      const err = document.getElementById('age-error');
      const input = document.getElementById('birth-year');
      if(!form || !input) return;
      form.addEventListener('submit', (e)=>{
        e.preventDefault(); err.textContent='';
        const y=(input.value||'').trim();
        if(!validYear(y)) return err.textContent='Please enter a valid 4-digit year.';
        if(!is18ByYear(y)) return err.textContent='Sorry, you must be 18 or older.';
        setPass(); unlock();
      });
      try{ input.focus(); }catch(e){}
    }
    if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>

  <script>
  // Age gate guard – ensures no white screen
  (function () {
    function ensureNotStuck() {
      if (document.documentElement.classList.contains('agegate-active') &&
          !document.getElementById('age-gate-overlay')) {
        document.documentElement.classList.remove('agegate-active');
        if (document.body) document.body.style.overflow = '';
        console.warn('[age-gate] overlay missing; pre-lock removed');
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ensureNotStuck);
    else ensureNotStuck();
  })();
  </script>
</body>
</html>
