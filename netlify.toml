# netlify.toml

[build]
  command = "npm install --no-fund --no-audit && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION  = "10"

# (Optional: keep these the same)
[context.deploy-preview]
  command = "npm install --no-fund --no-audit && npm run build"
  publish = "dist"

[context.branch-deploy]
  command = "npm install --no-fund --no-audit && npm run build"
  publish = "dist"
