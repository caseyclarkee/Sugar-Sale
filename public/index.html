<!-- AGE GATE: pre-hydration lock -->
<script>
  // Add a class to <html> ASAP to prevent background content from showing
  (function() {
    try {
      document.documentElement.classList.add('agegate-active');
    } catch(e){}
  })();
</script>
<style>
  /* Hide everything except our gate when active */
  .agegate-active body > :not(#age-gate-overlay) { display: none !important; }
  .agegate-active body { overflow: hidden !important; }
</style>

<body>
<!-- AGE GATE OVERLAY -->
<div id="age-gate-overlay" aria-modal="true" role="dialog" style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b0b0e;">
  <div style="width:min(92vw,540px);background:#111827;color:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.6);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;">
    <h1 style="margin:0 0 8px;font-size:24px;line-height:1.2;">Are you 18 or older?</h1>
    <p style="margin:0 0 18px;color:#d1d5db;font-size:14px;line-height:1.4;">Enter your date of birth to continue. We use this only to verify you’re 18+ and store a temporary pass for 1 hour.</p>
    <form id="age-gate-form" novalidate>
      <div style="display:flex;gap:10px;margin-bottom:12px;">
        <input id="dob-day" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="DD" aria-label="Day" maxlength="2"
               style="flex:1;min-width:64px;padding:12px 10px;border-radius:10px;border:1px solid #374151;background:#0f172a;color:#e5e7eb;outline:none;">
        <input id="dob-month" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="MM" aria-label="Month" maxlength="2"
               style="flex:1;min-width:64px;padding:12px 10px;border-radius:10px;border:1px solid #374151;background:#0f172a;color:#e5e7eb;outline:none;">
        <input id="dob-year" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="YYYY" aria-label="Year" maxlength="4"
               style="flex:2;min-width:92px;padding:12px 10px;border-radius:10px;border:1px solid #374151;background:#0f172a;color:#e5e7eb;outline:none;">
      </div>
      <button type="submit" style="appearance:none;border:0;background:#facc15;color:#111827;border-radius:10px;padding:12px 14px;font-weight:700;width:100%;cursor:pointer;">Enter</button>
      <p id="age-gate-error" style="margin:10px 0 0;color:#fca5a5;font-size:13px;min-height:17px;"></p>
      <p style="margin:16px 0 0;font-size:12px;color:#9ca3af;">If you are under 18, please leave this site.</p>
    </form>
  </div>
</div>

  <!-- Hidden form MUST be inside <body> so Netlify can see it -->
  <form name="interest" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
  </form>

  <!-- Your React mount point -->
  <div id="root"></div>

  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- App -->
  <script src="./app.js"></script>

  <!-- Footer Links -->
  <footer style="text-align: center; margin-top: 60px;">
    <div style="display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; font-family: 'Arial Black', sans-serif;">

<!-- AGE GATE LOGIC -->
<script>
(function() {
  var KEY = 'age_verified_until';
  var ONE_HOUR_MS = 60 * 60 * 1000;

  function getNow() { return new Date().getTime(); }

  function checkStoredPass() {
    try {
      var v = localStorage.getItem(KEY);
      if (!v) return false;
      var until = parseInt(v, 10);
      return until && until > getNow();
    } catch (e) { return false; }
  }

  function storePassForOneHour() {
    try {
      localStorage.setItem(KEY, String(getNow() + ONE_HOUR_MS));
    } catch (e) {}
  }

  function isValidDate(y,m,d) {
    var yy = Number(y), mm = Number(m), dd = Number(d);
    if(!yy || !mm || !dd) return false;
    if(yy < 1900 || yy > 9999) return false;
    if(mm < 1 || mm > 12) return false;
    var daysInMonth = new Date(yy, mm, 0).getDate();
    if(dd < 1 || dd > daysInMonth) return false;
    return true;
  }

  function is18OrOlder(y,m,d) {
    var today = new Date();
    var cutoff = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
    var dob = new Date(Number(y), Number(m)-1, Number(d));
    return dob <= cutoff;
  }

  function unlock() {
    try {
      var overlay = document.getElementById('age-gate-overlay');
      if (overlay) overlay.parentNode.removeChild(overlay);
      document.documentElement.classList.remove('agegate-active');
    } catch(e){}
  }

  function init() {
    if (checkStoredPass()) {
      unlock();
      return;
    }
    // Ensure overlay exists (in case of JS errors)
    if (!document.getElementById('age-gate-overlay')) {
      var d = document.createElement('div');
      d.id = 'age-gate-overlay';
      d.style.cssText = 'position:fixed;inset:0;background:#000;z-index:2147483647;';
      document.body.appendChild(d);
    }
    var form = document.getElementById('age-gate-form');
    var err = document.getElementById('age-gate-error');
    if (form) {
      form.addEventListener('submit', function(e){
        e.preventDefault();
        err.textContent = '';
        var day = (document.getElementById('dob-day')||{}).value || '';
        var month = (document.getElementById('dob-month')||{}).value || '';
        var year = (document.getElementById('dob-year')||{}).value || '';

        if(!isValidDate(year, month, day)) {
          err.textContent = 'Please enter a valid date (DD / MM / YYYY).';
          return;
        }
        if(!is18OrOlder(year, month, day)) {
          err.textContent = 'Sorry, you must be 18 or older to enter.';
          return;
        }
        storePassForOneHour();
        unlock();
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
