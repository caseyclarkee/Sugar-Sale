<!DOCTYPE html>

  <title>Sugar Liquidation Sale — Coming Soon</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- Hidden form: lets Netlify detect the form at build time -->
  <form name="interest" data-netlify="true" netlify-honeypot="bot-field" hidden>

  <!-- App -->

<!-- Footer Links -->
