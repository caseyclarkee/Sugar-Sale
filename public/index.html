  <!-- Hidden form: lets Netlify detect the form at build time -->
  <form name="interest" data-netlify="true" netlify-honeypot="bot-field" hidden method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field">

<body>
  <div id="root"></div>

 <!-- Age Gate Overlay -->
<div id="age-gate-overlay" class="age-gate" role="dialog" aria-modal="true" aria-labelledby="age-title">
  <div class="age-card">
    <h2 id="age-title">Are you 18 or older? Enter your date of birth</h2>
    <form id="age-gate-form">
      <div class="row">
        <input type="number" id="birth-day" name="birth-day" placeholder="DD" min="1" max="31" inputmode="numeric" required />
        <input type="number" id="birth-month" name="birth-month" placeholder="MM" min="1" max="12" inputmode="numeric" required />
        <input type="number" id="birth-year" name="birth-year" placeholder="YYYY" min="1900" inputmode="numeric" required />
        <button type="submit" class="cta">Continue</button>
      </div>
      <p id="age-error" class="error" aria-live="polite"></p>
      <small class="muted"></small>
    </form>
  </div>
</div>


<!-- Modal: Register Interest -->
<div id="modal-overlay" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" style="display:none;">
  <div class="modal-card" role="document">
    <button class="close" id="modal-close" aria-label="Close">×</button>
    <h2 class="modal-title">Register your interest</h2>
    <form name="interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/">
      <input type="hidden" name="form-name" value="interest" />
      <input type="hidden" name="bot-field" />
      <div class="form-grid">
        <input class="input" type="text" name="name" placeholder="Name" required />
        <input class="input" type="email" name="email" placeholder="Email" required />
        <button type="submit" class="cta">Submit</button>
      </div>
    </form>
    <p class="success" id="modal-success" style="display:none;">Thanks! You’re on the list.</p>
    <small class="muted">
      By submitting this form, you agree to our 
      <a href="https://www.asahibeverages.com/privacy-collection-notice" target="_blank" rel="noopener noreferrer">
        Privacy Collection Notice
      </a>.
    </small>
  </div>
</div>


  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- App -->
  <script src="./app.js"></script>

  
  <script>
(function(){
  if (window.__modalInit) return; window.__modalInit = true;

  function qs(s){ return document.querySelector(s); }
  function isTrigger(el){
    return !!el && el.matches('#openFormBtn, .openFormBtn, button[data-open="interest"], a[data-open="interest"]');
  }
  function findTrigger(t){
    while(t && t !== document.body){
      if(isTrigger(t)) return t;
      t = t.parentElement;
    }
    return null;
  }

  function openModal(ev){
    const ov = qs('#modal-overlay'); if(!ov) return;
    ov.style.display='flex';
    ov.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';

    const first = ov.querySelector('input[name="name"], input, button');
    if(first){ try{ first.focus(); }catch(_){} }

    const form = ov.querySelector('form[name="interest"]');
    const ok   = qs('#modal-success');
    if(form) form.style.display='block';
    if(ok) ok.style.display='none';

    // Important for iOS: prevent ghost click cancellation
    if(ev && (ev.type==='touchend' || ev.type==='touchstart')) ev.preventDefault();
  }

  function closeModal(){
    const ov = qs('#modal-overlay'); if(!ov) return;
    ov.style.display='none';
    ov.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
  }

  function handleSubmit(ev){
    const form = ev.target;
    if(!(form && form.getAttribute('name')==='interest')) return;
    ev.preventDefault();

    const btn = form.querySelector('button[type="submit"], .cta');
    const txt = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }

    const data = new FormData(form);
    if(!data.get('form-name')) data.append('form-name','interest'); // Netlify requires this
    const body = new URLSearchParams(data);

    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
      credentials: 'same-origin'
    }).then(function(){
      if(btn){ btn.disabled = false; btn.textContent = txt; }
      form.reset();
      const ok = document.getElementById('modal-success');
      if(ok) ok.style.display='block';
      form.style.display='none';
      const done = document.getElementById('modal-done');
      if(done){ done.addEventListener('click', closeModal, { once:true }); }
    }).catch(function(){
      if(btn){ btn.disabled = false; btn.textContent = txt; }
      try { form.submit(); } catch(_) {}
    });
  }

  // Delegated handlers so React re-renders don't drop listeners
  function delegatedOpen(ev){
    const t = findTrigger(ev.target);
    if(t) openModal(ev);
  }

  function init(){
    document.addEventListener('click', delegatedOpen, false);
    document.addEventListener('touchend', delegatedOpen, { passive: false }); // iOS tap support

    const close = qs('#modal-close');
    const overlay = qs('#modal-overlay');

    if(close) close.addEventListener('click', closeModal);
    if(overlay) overlay.addEventListener('click', function(ev){
      if(ev.target === overlay) closeModal();
    });

    document.addEventListener('keydown', function(ev){
      if(ev.key === 'Escape') closeModal();
    });

    document.addEventListener('submit', handleSubmit, true);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

  <script>
  (function () {
    // Guard against double init
    if (window.__ageGateInit) return; window.__ageGateInit = true;

    // --- helpers ---
    function unlock() {
      try { document.documentElement.classList.remove('agegate-active'); } catch (e) {}
      var ov = document.getElementById('age-gate-overlay');
      if (ov) { ov.style.display = 'none'; }
      document.body.style.overflow = '';
    }

    function getPass() {
      try { return JSON.parse(localStorage.getItem('ageGatePass') || 'null'); } catch (e) { return null; }
    }
    function setPass() {
      try { localStorage.setItem('ageGatePass', JSON.stringify({ ts: Date.now() })); } catch (e) {}
    }
    function isPassValid(pass) {
      if (!pass || !pass.ts) return false;
      var ONE_HOUR = 60 * 60 * 1000;
      return (Date.now() - pass.ts) < ONE_HOUR;
    }

    function isValidDate(y, m, d) {
      // Months are 1–12 in UI, 0–11 in Date
      var dt = new Date(y, m - 1, d);
      return dt.getFullYear() === y && (dt.getMonth() + 1) === m && dt.getDate() === d;
    }

    function isAdult(d, m, y) {
      var birth = new Date(y, m - 1, d);
      var cutoff = new Date();
      cutoff.setHours(0, 0, 0, 0);
      cutoff.setFullYear(cutoff.getFullYear() - 18);
      return birth <= cutoff;
    }

    function autoAdvanceSetup(dayEl, monthEl, yearEl) {
      function goNext(current, next, maxLen) {
        current.addEventListener('input', function () {
          if (this.value.length >= maxLen) { next && next.focus(); }
        });
      }
      if (dayEl && monthEl) goNext(dayEl, monthEl, 2);
      if (monthEl && yearEl) goNext(monthEl, yearEl, 2);
    }

    function init() {
      // If we already have a recent pass, unlock immediately
      var pass = getPass();
      if (pass && isPassValid(pass)) { return unlock(); }

      var form  = document.getElementById('age-gate-form');
      var err   = document.getElementById('age-error');
      var dayEl   = document.getElementById('birth-day');
      var monthEl = document.getElementById('birth-month');
      var yearEl  = document.getElementById('birth-year');

      if (!form || !dayEl || !monthEl || !yearEl) return;

      autoAdvanceSetup(dayEl, monthEl, yearEl);

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        err.textContent = '';

        var d = parseInt((dayEl.value || '').trim(), 10);
        var m = parseInt((monthEl.value || '').trim(), 10);
        var y = parseInt((yearEl.value || '').trim(), 10);

        var nowYear = (new Date()).getFullYear();

        // Basic range checks
        if (!d || !m || !y || m < 1 || m > 12 || d < 1 || d > 31 || y < 1900 || y > nowYear) {
          err.textContent = 'Please enter a valid date of birth.';
          return;
        }

        // Real calendar validation (incl. leap years)
        if (!isValidDate(y, m, d)) {
          err.textContent = 'That date doesn’t exist. Please check and try again.';
          return;
        }

        // 18+ check (exact, day-accurate)
        if (!isAdult(d, m, y)) {
          err.textContent = 'Sorry, you must be 18 or older.';
          return;
        }

        // Passed — remember for an hour and unlock
        setPass();
        unlock();
      });

      // Autofocus first field
      try { dayEl.focus(); } catch (e) {}
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
